    ['Can I change the exercises in a day?', 'Yes — open a workout and tap "Edit exercises" to add, remove, or swap any exercise for that day. This never changes your saved history.'],
    ['Can I change which days I train?', 'Yes — on the Calendar, drag a workout onto a different day, or use "Change day" on any workout card. Your profile\'s day/style settings only matter when you regenerate the whole plan.'],
    ['How is my data stored?', 'It\'s cached on this device for instant loading, and — when cloud sync is available — also saved to your account so the same profile and history follow you to other signed-in devices.'],
    ['What if I miss a workout?', 'Nothing shifts automatically. The Dashboard will ask what you\'d like to do (move it, skip it, or reschedule your week) so you stay in control of your own recovery.'],
  ];
  return `
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${faqs.map(([q,a])=>`
        <div class="card-flat">
          <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">${q}</div>
          <div style="font-size:12.5px;color:var(--text-dim);">${a}</div>
        </div>`).join('')}
    </div>
  `;
}
function askTabHTML(){
  const chat = App.state.helpChat;
  return `
    <div id="help-chat-log" style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;">
      ${chat.length===0 ? `<div style="font-size:12.5px;color:var(--text-faint);">Ask anything about training, your plan, or the app — e.g. "is 3 days a week enough?" or "why did my recommended weight go up?"</div>` : chat.filter(m=>m.role!=='context').map(m=>`
        <div class="chat-bubble ${m.role==='user'?'chat-bubble-user':'chat-bubble-assistant'}">${escapeHtml(m.content)}</div>`).join('')}
      ${App.state.helpAsking ? `<div class="chat-bubble chat-bubble-assistant" style="color:var(--text-dim);">Thinking…</div>` : ''}
    </div>
    <div style="display:flex;gap:8px;">
      <input class="input" id="help-question-input" placeholder="Type your question…" onkeydown="if(event.key==='Enter'){event.preventDefault();sendHelpQuestion();}">
      <button class="btn btn-primary btn-sm" onclick="sendHelpQuestion()" ${App.state.helpAsking?'disabled':''}>Ask</button>
    </div>
  `;
}
function scrollHelpChatToBottom(){
  const log = document.getElementById('help-chat-log');
  if(log) log.scrollTop = log.scrollHeight;
}
async function sendHelpQuestion(){
  const input = document.getElementById('help-question-input');
  const q = (input.value || '').trim();
  if(!q || App.state.helpAsking) return;
  input.value = '';
  App.state.helpChat.push({role:'user', content:q});
  App.state.helpAsking = true;
  App.openModal(helpModalHTML());
  scrollHelpChatToBottom();

  const sample = await getSample();
  if(!sample){
    App.state.helpChat.push({role:'assistant', content:"I can't reach Claude for live answers from this view right now — try the FAQ tab, or ask me directly in the main chat where you're editing this app."});
    App.state.helpAsking = false;
    App.openModal(helpModalHTML());
    scrollHelpChatToBottom();
    return;
  }
  const profile = Storage.getUserProfile();
  const plan = Storage.getWorkoutPlan();
  const context = `You are a concise, encouraging, safety-conscious fitness assistant embedded inside a personal gym workout planner app called Ironline. Answer in a few short sentences, not an essay. Ground answers in general, sustainable training practice; never give a medical diagnosis and suggest seeing a qualified professional for pain, injury, or medical concerns. If asked something unrelated to fitness or this app, answer briefly and steer back.
The person's profile: goal="${profile.goal}", experience="${profile.experience}", days/week=${profile.daysPerWeek}, plan style="${plan?plan.style:'none yet'}".
Their current plan days: ${plan ? plan.days.map(d=>d.name).join(', ') : 'none yet'}.`;
  const turns = [{role:'user', content:context}, ...App.state.helpChat.filter(m=>m.role!=='context').map(m=>({role:m.role, content:m.content}))];
  try{
    const {text} = await sample(turns, {
      modelTier:'quick',
      onText: ({text})=>{
        const last = App.state.helpChat[App.state.helpChat.length-1];
        if(!last || last.role!=='assistant' || !last.streaming) App.state.helpChat.push({role:'assistant', content:text, streaming:true});
        else last.content = text;
        App.openModal(helpModalHTML());
        scrollHelpChatToBottom();
      }
    });
    const last = App.state.helpChat[App.state.helpChat.length-1];
    if(last && last.streaming){ last.content = text; delete last.streaming; }
    else App.state.helpChat.push({role:'assistant', content:text});
  }catch(e){
    App.state.helpChat.push({role:'assistant', content: e.code==='not_granted' ? "I can't answer without permission to use Claude in this view — the FAQ tab still works." : "Sorry, I couldn't get an answer just now — please try again."});
  }
  App.state.helpAsking = false;
  App.openModal(helpModalHTML());
  scrollHelpChatToBottom();
}

function addExerciseTabHTML(){
  const suggestion = App.state.exerciseSuggestion;
  return `
    <p style="font-size:12.5px;color:var(--text-dim);margin:0 0 10px;">Describe the exercise you're looking for — Claude will draft a full library entry (target muscles, setup, cues) for you to review before it's added.</p>
    <textarea class="input" id="exercise-desc-input" placeholder="e.g. 'cable lateral raise with a rope attachment' or 'sissy squat'" style="margin-bottom:10px;min-height:70px;">${escapeHtml(App.state.exerciseDraftInput||'')}</textarea>
    <button class="btn btn-primary" style="width:100%;" onclick="generateExerciseSuggestion()" ${App.state.exerciseGenerating?'disabled':''}>${App.state.exerciseGenerating?'Thinking…':'Suggest this exercise'}</button>
    ${suggestion ? exerciseSuggestionPreviewHTML(suggestion) : ''}
  `;
}
async function generateExerciseSuggestion(){
  const input = document.getElementById('exercise-desc-input');
  App.state.exerciseDraftInput = input.value;
  const desc = (input.value || '').trim();
  if(!desc){ App.showToast('Describe the exercise first.'); return; }
  const sample = await getSample();
  if(!sample){ App.showToast("Can't reach Claude for this from this view right now."); return; }
  App.state.exerciseGenerating = true;
  App.state.exerciseSuggestion = null;
  App.openModal(helpModalHTML());
  const prompt = `Define one strength-training exercise for a beginner-friendly gym app, based on this description: "${desc}".
Reply with ONLY a JSON object with exactly these fields — no other text:
{"name": string, "category": one of ${JSON.stringify(CATEGORIES)}, "type": "compound" or "isolation",
 "target": string (primary muscle(s), comma-separated), "secondary": string (secondary muscles, comma-separated, or "—"),
 "equipment": one of ${JSON.stringify(['Full gym','Dumbbells','Machines','Barbell','Home equipment'])},
 "difficulty": "Beginner" or "Intermediate" or "Advanced",
 "instructions": string (1-2 sentences, how to perform it), "mistakes": string (one sentence, the single most common mistake),
 "beginnerAlt": string (an easier alternative exercise name, or "—"), "progression": string (how to make it harder later),
 "regression": string (how to make it easier), "pattern": one of ${JSON.stringify(Object.keys(PATTERNS))} (pick by the actual movement: pressing away from the body = horizontal-press/vertical-press/incline-press, pulling toward the body = vertical-pull/horizontal-pull, knee-dominant = squat, hip-hinge = hinge, elbow curl = curl, static hold = isometric, etc.)}
If the description is not a real, safe strength exercise, instead reply with only {"error": "one short sentence why"}.`;
  try{
    const data = await sample.json(prompt, {modelTier:'quick'});
    if(data && data.error){
      App.showToast(String(data.error));
    } else if(data && data.name && data.category){
      // Never trust the model's output blindly — clamp every field to a known-safe value.
      data.category = CATEGORIES.includes(data.category) ? data.category : 'Core';
      data.type = data.type === 'compound' ? 'compound' : 'isolation';
      data.equipment = ['Full gym','Dumbbells','Machines','Barbell','Home equipment'].includes(data.equipment) ? data.equipment : 'Full gym';
      data.difficulty = ['Beginner','Intermediate','Advanced'].includes(data.difficulty) ? data.difficulty : 'Beginner';
      data.pattern = PATTERNS[data.pattern] ? data.pattern : 'isometric';
      data.target = String(data.target || 'Muscles worked').slice(0,80);
      data.secondary = String(data.secondary || '—').slice(0,80);
      data.instructions = String(data.instructions || 'Perform with control, prioritizing good technique over weight.').slice(0,400);
      data.mistakes = String(data.mistakes || 'Using more weight than can be controlled with good form.').slice(0,200);
      data.beginnerAlt = String(data.beginnerAlt || '—').slice(0,60);
      data.progression = String(data.progression || 'Increase load slightly once the full rep range feels controlled.').slice(0,200);
      data.regression = String(data.regression || 'Reduce load or range of motion.').slice(0,200);
      data.name = String(data.name).slice(0,60);
      App.state.exerciseSuggestion = data;
    } else {
      App.showToast("Couldn't parse a suggestion — try describing it differently.");
    }
  }catch(e){
    App.showToast(e.code==='not_granted' ? 'Permission to ask Claude was declined.' : "Couldn't generate a suggestion — try again or rephrase.");
  }
  App.state.exerciseGenerating = false;
  App.openModal(helpModalHTML());
}
function exerciseSuggestionPreviewHTML(data){
  const view = BACK_VIEW_CATEGORIES.has(data.category) ? 'back' : 'front';
  const primary = data.target.split(',').map(s=>s.trim());
  const secondary = (!data.secondary || data.secondary === '—') ? [] : data.secondary.split(',').map(s=>s.trim());
  return `
    <div class="card" style="margin-top:14px;">
      <div style="display:flex;gap:12px;align-items:flex-start;">
        <div style="flex-shrink:0;background:var(--surface-2);border-radius:10px;padding:4px;">${bodyDiagramSVG(view, primary, secondary, 56)}</div>
        <div style="flex:1;min-width:0;">
          <div class="pill" style="margin-bottom:6px;">${escapeHtml(data.category)} · ${data.type==='compound'?'Compound':'Isolation'}</div>
          <div style="font-weight:700;font-size:15px;">${escapeHtml(data.name)}</div>
          <div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${escapeHtml(data.target)} · ${escapeHtml(data.equipment)}</div>
        </div>
        <span class="badge-difficulty badge-${data.difficulty}">${data.difficulty}</span>
      </div>
      <div class="divider"></div>
      <div style="font-size:12.5px;color:var(--text-dim);margin-bottom:8px;"><strong style="color:var(--text)">How to do it:</strong> ${escapeHtml(data.instructions)}</div>
      <div style="font-size:12.5px;color:var(--text-dim);"><strong style="color:var(--text)">Watch out for:</strong> ${escapeHtml(data.mistakes)}</div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn-primary" style="flex:1;" onclick="confirmAddSuggestedExercise()">Add to my library</button>
        <button class="btn btn-ghost" onclick="App.state.exerciseSuggestion=null;App.openModal(helpModalHTML())">Discard</button>
      </div>
      <p style="font-size:11px;color:var(--text-faint);margin-top:10px;">AI-drafted — review before adding, especially for unfamiliar equipment or technique. Ironline can't verify this is safe for you personally.</p>
    </div>
  `;
}
function confirmAddSuggestedExercise(){
  const data = App.state.exerciseSuggestion;
  if(!data) return;
  const slug = data.name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  const id = 'custom_' + (slug || 'exercise') + '_' + Date.now().toString(36);
  const ex = {
    id, name: data.name, category: data.category, type: data.type,
    target: data.target, secondary: data.secondary, equipment: data.equipment, difficulty: data.difficulty,
    instructions: data.instructions, mistakes: data.mistakes, beginnerAlt: data.beginnerAlt,
    progression: data.progression, regression: data.regression, pattern: data.pattern,
  };
  Storage.saveCustomExercise(ex);
  loadCustomExercisesIntoLibrary();
  App.state.exerciseSuggestion = null;
  App.state.exerciseDraftInput = '';
  App.showToast(`${ex.name} added — find it in the Exercise Library or when adding exercises to a day.`);
  App.closeModal();
}

/* =========================================================================
   UTIL
========================================================================= */
function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

App.init();
</script>
</body>
</html>
