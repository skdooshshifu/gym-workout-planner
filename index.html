<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ironline — Gym Workout Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* ---------- Design tokens ---------- */
:root{
  --ink:#F3F4F7;
  --ink-dim:#171a21;
  --bg:#0E1013;
  --surface:#161920;
  --surface-2:#1D2129;
  --border:#2A2F3A;
  --text:#EDEEF0;
  --text-dim:#9AA0AC;
  --text-faint:#5C6270;
  --ember:#FF6A3D;
  --ember-dim:#B84E2C;
  --teal:#33D6C0;
  --amber:#F2B84B;
  --danger:#F1554C;
  --good:#5FD187;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --font-display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Inter',ui-sans-serif,system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#F4F5F7;
  --surface:#FFFFFF;
  --surface-2:#F0F1F4;
  --border:#E1E3E9;
  --text:#161920;
  --text-dim:#5B6270;
  --text-faint:#9299A6;
  --ember:#E85A32;
  --ember-dim:#C7481F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,.font-display{font-family:var(--font-display);letter-spacing:-0.01em;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
.container{max-width:1180px;margin:0 auto;padding:0 20px;}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:18px;
}
.card-flat{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:600;font-size:14px;padding:11px 18px;border-radius:12px;
  border:1px solid transparent;cursor:pointer;transition:transform .12s ease, opacity .12s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--ember);color:#1A0B05;}
.btn-primary:hover{background:var(--ember-dim);}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
.input, select, textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;
}
.input:focus, select:focus, textarea:focus{border-color:var(--ember);}
label.field-label{font-size:12.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;display:block;}
.field{margin-bottom:14px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:820px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  padding:9px 14px;border-radius:11px;border:1px solid var(--border);background:var(--surface-2);
  font-size:13.5px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:.12s;
}
.chip.active{background:var(--ember);color:#1A0B05;border-color:var(--ember);}
.progress-track{height:8px;border-radius:20px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ember),var(--amber));border-radius:20px;transition:width .4s ease;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:720px){.modal-backdrop{align-items:center;}}
.modal-panel{background:var(--surface);border:1px solid var(--border);border-radius:22px 22px 0 0;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;animation:slideUp .22s ease;}
@media(min-width:720px){.modal-panel{border-radius:20px;}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.fade-in{animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.save-indicator{font-size:12px;color:var(--text-faint);display:flex;align-items:center;gap:6px;}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--good);}
.save-dot.saving{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.35;}}
/* nav */
.sidenav{width:230px;flex-shrink:0;border-right:1px solid var(--border);min-height:100vh;padding:22px 14px;position:sticky;top:0;}
.sidenav a, .navitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text-dim);font-weight:600;font-size:14.5px;cursor:pointer;margin-bottom:2px;}
.sidenav a.active, .navitem.active{background:var(--surface-2);color:var(--text);}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50;}
.bottomnav .navitem{flex-direction:column;font-size:10.5px;gap:3px;padding:6px 4px;flex:1;text-align:center;color:var(--text-faint);border-radius:10px;}
.bottomnav .navitem.active{color:var(--ember);background:transparent;}
.icon{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
@media(min-width:900px){.bottomnav{display:none;}}
@media(max-width:899px){.sidenav{display:none;}#mainpad{padding-bottom:88px;}}
.stat-num{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1;}
.stat-label{font-size:12.5px;color:var(--text-dim);font-weight:600;margin-top:4px;}
.exlist-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);margin-bottom:10px;cursor:pointer;}
.badge-difficulty{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:8px;}
.badge-Beginner{background:rgba(95,209,135,.15);color:var(--good);}
.badge-Intermediate{background:rgba(242,184,75,.15);color:var(--amber);}
.badge-Advanced{background:rgba(241,85,76,.15);color:var(--danger);}
.day-tab{padding:10px 6px;border-radius:14px;text-align:center;border:1px solid var(--border);background:var(--surface-2);font-size:12px;font-weight:700;cursor:pointer;}
.day-tab.today{border-color:var(--ember);}
.day-tab.completed{background:rgba(95,209,135,.12);border-color:var(--good);}
.day-tab.rest{opacity:.55;}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 1fr 34px;gap:8px;align-items:center;margin-bottom:8px;}
.set-row input{text-align:center;padding:8px 4px;}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.help-fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--ember);color:#1A0B05;border:none;box-shadow:0 8px 20px rgba(0,0,0,.35);font-size:20px;font-weight:700;cursor:pointer;z-index:45;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);}
.help-fab:active{transform:scale(0.94);}
@media(min-width:900px){.help-fab{bottom:24px;}}
.chat-bubble-user{align-self:flex-end;background:var(--ember);color:#1A0B05;}
.chat-bubble-assistant{align-self:flex-start;background:var(--surface-2);color:var(--text);}
.chat-bubble{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;line-height:1.5;}
@media(min-width:900px){.toast{bottom:24px;}}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);}
.tabs-row{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:16px;}
.tabs-row .tab{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer;}
.tabs-row .tab.active{background:var(--surface);color:var(--text);}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================================
   ⚙️  SUPABASE CONFIGURATION — put your project's URL and anon key HERE.
   Get both from: Supabase dashboard → your project → Settings → API.
   Use the "anon" / "public" key ONLY — never the "service_role" key here.
   The anon key is meant to be public in frontend code; Row Level Security
   (see the SQL provided separately) is what actually protects the data.
   Leave both as empty strings to run this app fully offline/local-only,
   exactly as before.
========================================================================= */
const SUPABASE_URL = 'https://hhtvmmvrfpnhrbmcfxkk.supabase.co/rest/v1/';       // e.g. 'https://xxxxxxxxxxxx.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhodHZtbXZyZnBuaHJibWNmeGtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMzcxODAsImV4cCI6MjEwNTcxMzE4MH0.UQK4dR7zt1azE4ZDZqPXuXh70_E4bdTdA64ouiDIErQ';  // e.g. 'eyJhbGciOi....' (the long anon/public key)

/* =========================================================================
   ICONS
========================================================================= */
const ICONS = {
  dashboard:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
  workout:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 12h2M18 12h2M6 8v8M18 8v8M8 12h8"/><rect x="2" y="9" width="2" height="6" rx="1"/><rect x="20" y="9" width="2" height="6" rx="1"/></svg>',
  calendar:'<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  exercises:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M6 21c0-3.5 2.7-6 6-6s6 2.5 6 6"/></svg>',
  stretch:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 6v6M12 12l-5 6M12 12l5 6M7 9l5 3 5-3"/></svg>',
  progress:'<svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
  profile:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>',
  chevron:'<svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M9 6l6 6-6 6"/></svg>',
  close:'<svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  info:'<svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>',
  check:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg>',
  sun:'<svg class="icon" viewBox="0 0 24 24" style="width:17px;height:17px"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  moon:'<svg class="icon" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  plus:'<svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="M12 5v14M5 12h14"/></svg>',
};

/* =========================================================================
   STORAGE LAYER  (storage.ts equivalent)
========================================================================= */
const DATA_VERSION = 1;
const LS = {
  PROFILE:'gwp_profile', PLAN:'gwp_plan', HISTORY:'gwp_history',
  MEASURE:'gwp_measurements', RECOVERY:'gwp_recovery', SETTINGS:'gwp_settings',
  DRAFT:'gwp_draft', CUSTOM_EX:'gwp_custom_exercises', VERSION:'gwp_version'
};
/* BUG FIX (QA audit): every date in this app used to be derived from Date#toISOString(),
 * which always renders the UTC date, not the viewer's local date. For anyone not in UTC+0,
 * that silently shifts "today" to yesterday or tomorrow for part of the day (e.g. it's
 * already tomorrow in UTC once it's evening in most of the Americas' timezones, and it's
 * still yesterday in UTC for the first few hours of the morning in Asia/Bangkok). These two
 * helpers are the single source of truth for "local calendar date" going forward. */
function localISODate(d){
  d = d || new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseLocalDate(str){
  if(!str) return new Date(NaN);
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, (m||1)-1, d||1);
}
function readJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ console.error('storage read failed', key, e); return fallback; }
}
function writeJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error('storage write failed', key, e); return false; }
}
const Storage = {
  getUserProfile(){ return readJSON(LS.PROFILE, null); },
  saveUserProfile(p){ const ok = writeJSON(LS.PROFILE, p); flashSave(ok); Cloud.pushProfile(p); Supa.pushProfile(p); return ok; },
  updateUserProfile(patch){ const cur = Storage.getUserProfile() || {}; const next = {...cur, ...patch}; return Storage.saveUserProfile(next); },

  getWorkoutPlan(){ return readJSON(LS.PLAN, null); },
  saveWorkoutPlan(plan){ const ok = writeJSON(LS.PLAN, plan); flashSave(ok); Cloud.pushPlan(plan); Supa.pushPlan(plan); return ok; },
  updateWorkoutPlan(patch){ const cur = Storage.getWorkoutPlan() || {}; return Storage.saveWorkoutPlan({...cur, ...patch}); },

  getWorkoutHistory(){ return readJSON(LS.HISTORY, []); },
  saveWorkoutSession(session){
    const hist = Storage.getWorkoutHistory();
    hist.push(session);
    const ok = writeJSON(LS.HISTORY, hist); flashSave(ok); Cloud.pushData(Cloud.currentDataBundle()); Supa.pushData(Cloud.currentDataBundle()); return ok;
  },
  getExerciseHistory(exerciseId){
    const hist = Storage.getWorkoutHistory();
    const out = [];
    hist.forEach(s=>{
      (s.exercises||[]).forEach(e=>{
        if(e.exerciseId===exerciseId) out.push({date:s.date, ...e});
      });
    });
    return out.sort((a,b)=> new Date(a.date)-new Date(b.date));
  },

  getBodyMeasurements(){ return readJSON(LS.MEASURE, []).sort((a,b)=> new Date(a.date)-new Date(b.date)); },
  saveBodyMeasurement(m){
    const arr = readJSON(LS.MEASURE, []);
    arr.push(m);
    const ok = writeJSON(LS.MEASURE, arr); flashSave(ok); Cloud.pushData(Cloud.currentDataBundle()); Supa.pushData(Cloud.currentDataBundle()); return ok;
  },

  getRecoveryLog(){ return readJSON(LS.RECOVERY, []).sort((a,b)=> new Date(a.date)-new Date(b.date)); },
  saveRecoveryEntry(r){
    const arr = readJSON(LS.RECOVERY, []);
    arr.push(r);
    const ok = writeJSON(LS.RECOVERY, arr); flashSave(ok); Cloud.pushData(Cloud.currentDataBundle()); Supa.pushData(Cloud.currentDataBundle()); return ok;
  },

  getSettings(){ return readJSON(LS.SETTINGS, {theme:'dark', units:'metric'}); },
  saveSettings(s){ const ok = writeJSON(LS.SETTINGS, s); flashSave(ok); Cloud.pushSettings(s); Supa.pushSettings(s); return ok; },

  /* BUG FIX: in-progress workout inputs (weight/reps/RPE/notes) used to live only in the DOM
   * and were never written to storage until "Complete Workout" was clicked. Closing the tab,
   * refreshing, or just navigating away before finishing silently discarded everything the
   * person had typed. Every field now autosaves into a per-day draft the moment it changes,
   * and the workout screen restores that draft on load until the workout is actually
   * completed (or a new day arrives, at which point a stale draft is ignored). */
  getWorkoutDraft(dayId){
    const all = readJSON(LS.DRAFT, {});
    const d = all[dayId];
    if(!d) return null;
    if(d.date !== localISODate()) return null; // stale draft from a previous day — ignore, don't restore
    return d;
  },
  saveWorkoutDraft(dayId, fields){
    const all = readJSON(LS.DRAFT, {});
    all[dayId] = {date: localISODate(), fields, savedAt: new Date().toISOString()};
    const ok = writeJSON(LS.DRAFT, all);
    flashSave(ok);
    Cloud.pushDraft(all);
    Supa.pushDraft(all);
    return ok;
  },
  clearWorkoutDraft(dayId){
    const all = readJSON(LS.DRAFT, {});
    delete all[dayId];
    writeJSON(LS.DRAFT, all);
    Cloud.pushDraft(all);
    Supa.pushDraft(all);
  },

  /* Exercises the person adds themselves (typically via the help assistant) when the
   * built-in library doesn't have what they want. Kept separate from EXERCISES so a
   * republish of this app never clobbers someone's custom additions. */
  getCustomExercises(){ return readJSON(LS.CUSTOM_EX, []); },
  saveCustomExercise(ex){
    const arr = readJSON(LS.CUSTOM_EX, []);
    arr.push(ex);
    const ok = writeJSON(LS.CUSTOM_EX, arr);
    flashSave(ok);
    Cloud.pushCustomExercises(arr);
    Supa.pushCustomExercises(arr);
    return ok;
  },

  exportAll(){
    return {
      dataVersion: DATA_VERSION,
      exportedAt: new Date().toISOString(),
      profile: Storage.getUserProfile(),
      plan: Storage.getWorkoutPlan(),
      history: Storage.getWorkoutHistory(),
      measurements: readJSON(LS.MEASURE, []),
      recovery: readJSON(LS.RECOVERY, []),
      settings: Storage.getSettings(),
      customExercises: readJSON(LS.CUSTOM_EX, []),
    };
  },
  importAll(obj){
    if(!obj || typeof obj !== 'object') throw new Error('Invalid backup file');
    if(obj.profile) writeJSON(LS.PROFILE, obj.profile);
    if(obj.plan) writeJSON(LS.PLAN, obj.plan);
    if(Array.isArray(obj.history)) writeJSON(LS.HISTORY, obj.history);
    if(Array.isArray(obj.measurements)) writeJSON(LS.MEASURE, obj.measurements);
    if(Array.isArray(obj.recovery)) writeJSON(LS.RECOVERY, obj.recovery);
    if(obj.settings) writeJSON(LS.SETTINGS, obj.settings);
    if(Array.isArray(obj.customExercises)) writeJSON(LS.CUSTOM_EX, obj.customExercises);
    writeJSON(LS.VERSION, DATA_VERSION);
    loadCustomExercisesIntoLibrary();
    Cloud.pushProfile(Storage.getUserProfile());
    Cloud.pushPlan(Storage.getWorkoutPlan());
    Cloud.pushData(Cloud.currentDataBundle());
    Cloud.pushSettings(Storage.getSettings());
    Cloud.pushCustomExercises(readJSON(LS.CUSTOM_EX, []));
    Supa.pushProfile(Storage.getUserProfile());
    Supa.pushPlan(Storage.getWorkoutPlan());
    Supa.pushData(Cloud.currentDataBundle());
    Supa.pushSettings(Storage.getSettings());
    Supa.pushCustomExercises(readJSON(LS.CUSTOM_EX, []));
    return true;
  },
  resetAll(){
    Object.values(LS).forEach(k=> localStorage.removeItem(k));
    loadCustomExercisesIntoLibrary();
    Cloud.resetCloud();
    Supa.resetRemote();
  }
};

/* =========================================================================
   SUPABASE SYNC + AUTH LAYER — the actual cross-device backend for the
   GitHub Pages deployment. Deliberately parallel to (and independent of)
   the Cloud object above: Cloud talks to claude.ai's own db capability
   (only present inside claude.ai) and stays completely dormant on GitHub
   Pages; Supa talks to Supabase and stays completely dormant if no URL/key
   is configured. Neither can interfere with the other. Storage.saveX()
   below simply calls both — whichever is actually active does the work.

   Data model: one table, `app_data(user_id, key, value jsonb, updated_at)`,
   RLS-restricted to `auth.uid() = user_id`. `key` is one of 'profile',
   'plan', 'data' (history+measurements+recovery bundle), 'draft',
   'settings', 'customExercises' — exactly the same keys Cloud already
   uses, so migrating between backends never required a data-shape change.
========================================================================= */
const Supa = {
  client:null, ready:false, session:null, channel:null, _queues:{},
  configured(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY); },
  setStatus(text, isError){
    const el = document.getElementById('supa-indicator');
    if(!el) return;
    el.innerHTML = `<span class="save-dot ${isError?'':''}" style="background:${isError?'var(--danger)':'var(--teal)'}"></span> ${text}`;
  },
  async init(){
    if(!this.configured() || typeof supabase === 'undefined'){ this.ready = true; return null; }
    if(this.client){
      // Already created once (e.g. App.init() re-ran after a reset) — just refresh session
      // state instead of constructing a second GoTrueClient against the same storage key.
      try{
        const { data } = await this.client.auth.getSession();
        this.session = data && data.session ? data.session : null;
      }catch(e){ console.error(e); }
      this.ready = true;
      return this.client;
    }
    try{
      this.client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
      const { data } = await this.client.auth.getSession();
      this.session = data && data.session ? data.session : null;
      this.client.auth.onAuthStateChange((event, session)=>{
        this.session = session;
        if(event === 'SIGNED_OUT'){ this.unsubscribe(); }
        render();
      });
    }catch(e){
      console.error('supabase init failed', e);
      this.client = null;
    }
    this.ready = true;
    return this.client;
  },
  isSignedIn(){ return !!(this.session && this.session.user); },
  userEmail(){ return this.isSignedIn() ? this.session.user.email : null; },
  userId(){ return this.isSignedIn() ? this.session.user.id : null; },

  async signUp(email, password){
    if(!this.client) throw new Error('Supabase is not configured.');
    const { data, error } = await this.client.auth.signUp({ email, password });
    if(error) throw error;
    this.session = data.session || this.session;
    return data;
  },
  async signIn(email, password){
    if(!this.client) throw new Error('Supabase is not configured.');
    const { data, error } = await this.client.auth.signInWithPassword({ email, password });
    if(error) throw error;
    this.session = data.session;
    return data;
  },
  async signOut(){
    if(!this.client) return;
    await this.unsubscribe();
    await this.client.auth.signOut();
    this.session = null;
  },

  async pull(){
    if(!this.client || !this.userId()) return null;
    try{
      const { data, error } = await this.client.from('app_data').select('key,value').eq('user_id', this.userId());
      if(error) throw error;
      const out = {};
      (data || []).forEach(row => { out[row.key] = row.value; });
      return out;
    }catch(e){
      console.error('supabase pull failed', e);
      this.setStatus('Sync failed — using local data', true);
      return null;
    }
  },
  async push(key, value){
    if(!this.client || !this.userId()) return;
    const prior = this._queues[key] || Promise.resolve();
    const run = prior.then(async ()=>{
      this.setStatus('Syncing to your account…');
      try{
        const { error } = await this.client.from('app_data').upsert({
          user_id: this.userId(), key, value, updated_at: new Date().toISOString()
        });
        if(error) throw error;
        this.setStatus('Synced to your account');
      }catch(e){
        console.error('supabase push failed', key, e);
        this.setStatus('Sync failed — saved on this device only, will retry on next change', true);
      }
    });
    this._queues[key] = run;
    return run;
  },
  pushProfile(p){ this.push('profile', p); },
  pushPlan(p){ this.push('plan', p); },
  pushData(d){ this.push('data', d); },
  pushDraft(d){ this.push('draft', d); },
  pushSettings(s){ this.push('settings', s); },
  pushCustomExercises(a){ this.push('customExercises', a); },

  subscribe(onChange){
    if(!this.client || !this.userId()) return;
    this.unsubscribe();
    try{
      this.channel = this.client
        .channel('app_data_' + this.userId())
        .on('postgres_changes', { event:'*', schema:'public', table:'app_data', filter:`user_id=eq.${this.userId()}` }, (payload)=>{
          const row = payload.new || payload.old;
          if(row && row.key) onChange(row.key, row.value);
        })
        .subscribe();
    }catch(e){ console.error('supabase realtime subscribe failed', e); }
  },
  async unsubscribe(){
    if(this.channel && this.client){
      try{ await this.client.removeChannel(this.channel); }catch(e){}
      this.channel = null;
    }
  },
  async resetRemote(){
    if(!this.client || !this.userId()) return;
    try{ await this.client.from('app_data').delete().eq('user_id', this.userId()); }
    catch(e){ console.error('supabase remote reset failed', e); }
  },

  /** One-time, explicit migration: push everything currently on THIS device up to the
   * signed-in account. Never deletes or touches local data — only reads it and writes
   * to Supabase — so a failure here can never cause data loss (requirements #10/#11). */
  async migrateLocalToAccount(overwrite){
    if(!this.userId()) throw new Error('Sign in first.');
    const bundle = {
      profile: Storage.getUserProfile(),
      plan: Storage.getWorkoutPlan(),
      data: Cloud.currentDataBundle(),
      settings: Storage.getSettings(),
      customExercises: readJSON(LS.CUSTOM_EX, []),
    };
    const rows = Object.keys(bundle)
      .filter(k => bundle[k] !== null && bundle[k] !== undefined)
      .map(k => ({ user_id:this.userId(), key:k, value:bundle[k], updated_at:new Date().toISOString() }));
    const { error } = await this.client.from('app_data').upsert(rows);
    if(error) throw error;
    return true;
  },
};

  if(!el) return;
  if(!ok){ el.innerHTML = '<span class="save-dot" style="background:var(--danger)"></span> Unable to save. Try again.'; return; }

/* =========================================================================
   CLOUD SYNC LAYER (db capability)
   Mirrors local storage to a per-account cloud store so the same signed-in
   account sees the same data on desktop and mobile. There is no separate
   username/password system — identity is the person's Claude account, and
   this artifact stays private to them unless they explicitly share it.
========================================================================= */
const Cloud = {
  db:null, ready:false, unsubs:[],
  _queues:{}, // BUG FIX (QA audit, Phase 18 autosave race): see push() below.
  setStatus(text, isError){
    const el = document.getElementById('cloud-indicator');
    if(!el) return;
    el.innerHTML = `<span class="save-dot ${isError?'':''}" style="background:${isError?'var(--danger)':'var(--teal)'}"></span> ${text}`;
  },
  async init(){
    try{ this.db = await claude.use('db'); } catch(e){ this.db = null; }
    this.ready = true;
    this.setStatus(this.db ? 'Cloud sync ready' : 'Local only — cloud sync unavailable in this view', !this.db);
    return this.db;
  },
  async pull(){
    if(!this.db) return null;
    try{
      const [profileSnap, planSnap, dataSnap, draftSnap, settingsSnap, customExSnap] = await Promise.all([
        this.db.doc('app/profile').get(),
        this.db.doc('app/plan').get(),
        this.db.doc('app/data').get(),
        this.db.doc('app/draft').get(),
        this.db.doc('app/settings').get(),
        this.db.doc('app/customExercises').get(),
      ]);
      return {
        profile: profileSnap.exists ? profileSnap.data() : null,
        plan: planSnap.exists ? planSnap.data() : null,
        data: dataSnap.exists ? dataSnap.data() : null,
        draft: draftSnap.exists ? draftSnap.data() : null,
        settings: settingsSnap.exists ? settingsSnap.data() : null,
        customExercises: customExSnap.exists ? customExSnap.data() : null,
      };
    }catch(e){ console.error('cloud pull failed', e); this.setStatus('Cloud sync failed — using local data', true); return null; }
  },
  /* BUG FIX (QA audit): pushes used to fire in parallel per docId. If the user changes the
   * same doc twice in quick succession (e.g. two rapid measurement saves), the two network
   * requests can resolve out of order — an older push finishing after a newer one would
   * silently overwrite the newer cloud data with stale data. Each docId now gets its own
   * promise chain so pushes to that doc are always sent and applied in the order they were
   * initiated, never overlapping. */
  async push(docId, body){
    if(!this.db) return;
    const prior = this._queues[docId] || Promise.resolve();
    const run = prior.then(async ()=>{
      this.setStatus('Syncing to cloud…');
      try{
        await this.db.doc('app/'+docId).set(body);
        this.setStatus('Synced across your devices');
      }catch(e){
        console.error('cloud push failed', docId, e);
        this.setStatus('Cloud sync failed — saved on this device only', true);
      }
    });
    this._queues[docId] = run;
    return run;
  },
  pushProfile(p){ this.push('profile', p); },
  pushPlan(p){ this.push('plan', p); },
  pushData(d){ this.push('data', d); },
  pushDraft(d){ this.push('draft', d); },
  pushCustomExercises(arr){ this.push('customExercises', arr); },
  pushSettings(s){ this.push('settings', s); },
  currentDataBundle(){ return {history: readJSON(LS.HISTORY,[]), measurements: readJSON(LS.MEASURE,[]), recovery: readJSON(LS.RECOVERY,[])}; },
  subscribe(onChange){
    if(!this.db) return;
    // BUG FIX (QA audit, Phase 24 leak): resetting data calls App.init() -> Cloud.init() ->
    // subscribe() again. Without clearing old listeners first, every reset added a fresh set
    // of onSnapshot subscriptions on top of the old ones, so cloud updates after a reset were
    // firing render() multiple times per change.
    this.unsubscribeAll();
    this.unsubs.push(this.db.doc('app/profile').onSnapshot(snap=>{ if(snap.exists) onChange('profile', snap.data()); }, e=>console.error(e)));
    this.unsubs.push(this.db.doc('app/plan').onSnapshot(snap=>{ if(snap.exists) onChange('plan', snap.data()); }, e=>console.error(e)));
    this.unsubs.push(this.db.doc('app/data').onSnapshot(snap=>{ if(snap.exists) onChange('data', snap.data()); }, e=>console.error(e)));
    this.unsubs.push(this.db.doc('app/draft').onSnapshot(snap=>{ if(snap.exists) onChange('draft', snap.data()); }, e=>console.error(e)));
    this.unsubs.push(this.db.doc('app/settings').onSnapshot(snap=>{ if(snap.exists) onChange('settings', snap.data()); }, e=>console.error(e)));
    this.unsubs.push(this.db.doc('app/customExercises').onSnapshot(snap=>{ if(snap.exists) onChange('customExercises', snap.data()); }, e=>console.error(e)));
  },
  unsubscribeAll(){
    this.unsubs.forEach(u=>{ try{ u && u(); }catch(e){} });
    this.unsubs = [];
  },
  async resetCloud(){
    if(!this.db) return;
    try{
      await Promise.all(['profile','plan','data','draft','settings','customExercises'].map(id=> this.db.doc('app/'+id).delete()));
    }catch(e){ console.error('cloud reset failed', e); }
  }
};

function bodyDiagramSVG(view, primaryList, secondaryList, size){
  size = size || 120;

/* BUG FIX (QA audit): the previous fallback tried to inline a full multi-line SVG string
 * literal (with unescaped newlines and double quotes) directly inside a single-quoted
 * inline onerror="" attribute. That's a JS syntax error the moment it actually runs — the
 * fallback would silently fail and the viewer would be left with a broken-image icon,
 * exactly what a real image fallback must never do. Currently no exercise has ex.image set,
 * so this path was never exercised, but it's the documented escape hatch for adding real
 * photos later, so it needs to actually work. Using a small keyed registry avoids ever
 * putting untrusted/complex string content inside an HTML attribute at all.
 */
window.__imgFallbacks = window.__imgFallbacks || {};
function imgFallback(el, key){
  const svg = window.__imgFallbacks[key];
  if(svg) el.outerHTML = svg;
}
function IMG(ex, size){
  // Forward-compatible: if a real image path/URL is ever set on the exercise, use it with a
  // graceful fallback to the generated diagram if it fails to load. Otherwise, use the diagram directly.
  if(ex.image){
    const key = ex.id + '_' + size;
    window.__imgFallbacks[key] = bodyDiagramSVG(ex.view, ex.primaryMuscles, ex.secondaryMuscles, size);
    return `<span style="display:inline-block;width:${size}px;height:${size*1.6}px;">
      <img src="${escapeHtml(ex.image)}" alt="${escapeHtml(ex.name)}" style="width:100%;height:100%;object-fit:contain;border-radius:8px;"
        loading="lazy" onerror="imgFallback(this,'${key}')">
    </span>`;
  }
  return bodyDiagramSVG(ex.view, ex.primaryMuscles, ex.secondaryMuscles, size);
}

const WEEKDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* =========================================================================
   WORKOUT PLAN GENERATOR + FLEXIBLE SCHEDULER
========================================================================= */
function prescriptionFor(exercise, experience){
  const isCompound = exercise.type === 'compound';
  const table = {
    Beginner:     isCompound ? {sets:3, reps:'6–10',  rest:'90–120 sec', rpe:'6–7'} : {sets:2, reps:'10–15', rest:'45–60 sec', rpe:'6–8'},
    Intermediate: isCompound ? {sets:3, reps:'6–10',  rest:'90–120 sec', rpe:'7–8'} : {sets:3, reps:'10–15', rest:'45–75 sec', rpe:'7–8'},
    Advanced:     isCompound ? {sets:4, reps:'5–8',   rest:'120–150 sec',rpe:'7–9'} : {sets:3, reps:'8–15',  rest:'45–75 sec', rpe:'7–9'},
  };
  return table[experience] || table.Beginner;
}
function pickStyle(profile){
  const days = Math.min(Math.max(parseInt(profile.daysPerWeek)||3, 2), 6);
  const requested = (profile.style && profile.style !== 'Custom' && STYLE_ROTATIONS[profile.style]) ? profile.style : null;
  // A Push/Pull/Legs split needs at least 3 days to include a leg day at all — forcing it
  // into 2 days would silently train push+pull forever and never touch the lower body.
  if(requested === 'Push/Pull/Legs' && days < 3) return 'Full Body';
  if(requested) return requested;
  if(days <= 3) return 'Full Body';
  if(days === 4) return 'Upper/Lower';
  return 'Push/Pull/Legs';
}
/** Which weekdays the plan should occupy, sorted to Mon→Sun order. Falls back to a sensible
 *  even spread when the person hasn't picked specific days yet. */
function resolveScheduleDays(profile){
  const count = Math.min(Math.max(parseInt(profile.daysPerWeek)||3, 2), 6);
  let days = Array.isArray(profile.scheduleDays) && profile.scheduleDays.length ? profile.scheduleDays.slice() : (WEEKDAY_ASSIGN[count] || WEEKDAY_ASSIGN[3]).slice();
  days = days.filter(d=>WEEKDAYS.includes(d));
  if(days.length === 0) days = WEEKDAY_ASSIGN[3].slice();
  days.sort((a,b)=> WEEKDAYS.indexOf(a) - WEEKDAYS.indexOf(b));
  return days;
}
function generatePlan(profile, existingPlan){
  const scheduleDays = resolveScheduleDays(profile);
  const days = Math.min(Math.max(scheduleDays.length, 2), 6);
  const style = pickStyle(profile);
  const rotation = (days === 2 && STYLE_ROTATIONS_2DAY[style]) ? STYLE_ROTATIONS_2DAY[style] : (STYLE_ROTATIONS[style] || STYLE_ROTATIONS['Full Body']);
  const planDays = scheduleDays.map((weekday, idx)=>{
    const tpl = rotation[idx % rotation.length];
    const cycle = Math.floor(idx / rotation.length);
    const name = cycle > 0 ? `${tpl.name} ${cycle+1}` : tpl.name;
    return {
      id: 'd'+idx,
      weekday,
      name,
      exercises: tpl.exercises.map((exId, order)=>{
        const ex = exById(exId);
        const rx = prescriptionFor(ex, profile.experience || 'Beginner');
        return {exerciseId: exId, order, sets: rx.sets, reps: rx.reps, rest: rx.rest, rpeTarget: rx.rpe};
      })
    };
  });
  return {
    id: 'plan_'+Date.now(),
    createdAt: new Date().toISOString(),
    style, daysPerWeek: days,
    profileSnapshot: {experience: profile.experience, goal: profile.goal},
    days: planDays
  };
}

/* ---- Recovery-aware conflict checking for the scheduler ---- */
const MUSCLE_GROUP_MAP = {Chest:'Push', Shoulders:'Push', Triceps:'Push', Back:'Pull', Biceps:'Pull', Quadriceps:'Legs', Hamstrings:'Legs', Glutes:'Legs', Calves:'Legs', Core:'Core'};
function dominantGroupsForDay(planDay){
  const counts = {};
  planDay.exercises.forEach(pe=>{
    const ex = exById(pe.exerciseId);
    const g = MUSCLE_GROUP_MAP[ex.category] || 'Other';
    counts[g] = (counts[g]||0) + 1;
  });
  const total = planDay.exercises.length || 1;
  return Object.keys(counts).filter(g=> g!=='Core' && counts[g]/total >= 0.4);
}
/** Returns human-readable warnings for any two workout days that fall on consecutive
 *  calendar days (including the Sun→Mon wrap) and share a dominant muscle group. Never
 *  blocks anything — the caller decides whether to show it and still proceed. */
function checkScheduleConflicts(planDays){
  const warnings = [];
  const byWeekday = {};
  planDays.forEach(d=> byWeekday[d.weekday] = d);
  for(let i=0;i<7;i++){
    const today = WEEKDAYS[i];
    const tomorrow = WEEKDAYS[(i+1)%7];
    const a = byWeekday[today], b = byWeekday[tomorrow];
    if(!a || !b) continue;
    const groupsA = dominantGroupsForDay(a), groupsB = dominantGroupsForDay(b);
    const overlap = groupsA.filter(g=> groupsB.includes(g));
    if(overlap.length){
      warnings.push(`${a.name} (${WEEKDAY_FULL[today]}) and ${b.name} (${WEEKDAY_FULL[tomorrow]}) both train ${overlap.join(' & ')} on consecutive days.`);
    }
  }
  return warnings;
}
/** Swap the weekday assignment of two plan days (used by drag-and-drop, "Change day", and
 *  the missed-workout rescheduler). Never touches completed history — only the template. */
function swapPlanDayWeekday(plan, dayIdA, weekdayB){
  const dayA = plan.days.find(d=>d.id===dayIdA);
  if(!dayA) return plan;
  const dayB = plan.days.find(d=>d.weekday===weekdayB);
  const oldWeekday = dayA.weekday;
  dayA.weekday = weekdayB;
  if(dayB) dayB.weekday = oldWeekday;
  return plan;
}

/* =========================================================================
   NUTRITION / BODY COMPOSITION MATH
========================================================================= */
function calcBMR(profile){
  const w = parseFloat(profile.weight)||70, h = parseFloat(profile.height)||170, a = parseFloat(profile.age)||25;
  const base = 10*w + 6.25*h - 5*a;
  if(profile.gender === 'Male') return base + 5;
  if(profile.gender === 'Female') return base - 161;
  return base - 78;
}
function calcTDEE(profile){
  const mult = {2:1.3, 3:1.375, 4:1.45, 5:1.55, 6:1.65}[Math.min(6,Math.max(2,parseInt(profile.daysPerWeek)||3))] || 1.4;
  return calcBMR(profile) * mult;
}
function calcCalorieTarget(profile){
  if(profile.customCalories) return parseInt(profile.customCalories);
  const tdee = calcTDEE(profile);
  const factors = {'Lose fat':0.8, 'Build muscle':1.1, 'Lose fat + build muscle':0.85, 'Maintain weight':1.0};
  return Math.round(tdee * (factors[profile.goal] || 0.9));
}
function calcProteinRange(profile){
  if(profile.customProteinLow && profile.customProteinHigh) return [parseInt(profile.customProteinLow), parseInt(profile.customProteinHigh)];
  const w = parseFloat(profile.weight)||70;
  return [Math.round(w*1.6), Math.round(w*2.2)];
}
function calcBMI(profile){
  const w = parseFloat(profile.weight)||70, h = (parseFloat(profile.height)||170)/100;
  return w/(h*h);
}
function bodyComp(weight, bf){
  const fatMass = weight * (bf/100);
  const lean = weight - fatMass;
  return {fatMass, lean};
}
function targetWeightFromBF(lean, targetBF){
  return lean / (1 - targetBF/100);
}

/* =========================================================================
   PROGRESSIVE OVERLOAD ENGINE
========================================================================= */
function roundToIncrement(w, inc=1.25){ return Math.round(w/inc)*inc; }
function recommendNextWeight(exerciseId){
  const hist = Storage.getExerciseHistory(exerciseId);
  if(!hist.length){
    return {type:'first', message:'Start with a light weight that allows you to perform the target reps with good technique and approximately RPE 6–7.'};
  }
  const last = hist[hist.length-1];
  const sets = last.sets || [];
  if(!sets.length) return {type:'first', message:'Start with a light weight that allows you to perform the target reps with good technique and approximately RPE 6–7.'};
  const anyPain = sets.some(s=>s.pain);
  const weight = sets[sets.length-1].weight || sets[0].weight || 0;
  const topRep = last.targetTopRep || 10;
  const allHitTop = sets.every(s => (parseFloat(s.reps)||0) >= topRep);
  const rpes = sets.map(s=>parseFloat(s.rpe)).filter(v=>!isNaN(v));
  const avgRpe = rpes.length ? rpes.reduce((a,b)=>a+b,0)/rpes.length : 7;

  if(anyPain){
    return {type:'pain', message:`Because pain was reported, keep the weight at ${weight} kg and review your technique. If pain persists, consult a qualified healthcare professional.`};
  }
  if(allHitTop && avgRpe <= 8){
    const inc = weight > 0 ? Math.max(1.25, roundToIncrement(weight*0.05,1.25)) : 2.5;
    const next = roundToIncrement(weight + inc, 1.25);
    return {type:'increase', message:`Great job! Consider increasing the weight to ${next} kg next session.`};
  }
  if(allHitTop && avgRpe > 8 && avgRpe < 9.5){
    return {type:'maintain', message:`Consider maintaining ${weight} kg, or increasing slightly if your gym has an appropriate increment.`};
  }
  return {type:'maintain_struggle', message:`Keep the weight at ${weight} kg until you can complete the target rep range with good form.`};
}

  {v:7, d:'Could do approximately 3 more reps'},
  {v:8, d:'Could do approximately 2 more reps'},

  {v:10,d:'Maximum effort — no more reps possible'},
];

/* =========================================================================
   HELPERS: today / plan lookup
========================================================================= */
function todayWeekdayCode(){ const d = new Date().getDay(); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]; }
function weekdayCodeForDate(date){ const d = date.getDay(); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]; }
function isoForOffset(daysAgo){ const d = new Date(); d.setDate(d.getDate()-daysAgo); return localISODate(d); }
function planDayForToday(){
  const plan = Storage.getWorkoutPlan();
  if(!plan) return null;
  const code = todayWeekdayCode();
  return plan.days.find(d=>d.weekday===code) || null;
}
function planDayForWeekday(code){
  const plan = Storage.getWorkoutPlan();
  if(!plan) return null;
  return plan.days.find(d=>d.weekday===code) || null;
}
function historyByDate(){
  const hist = Storage.getWorkoutHistory();
  const map = {};
  hist.forEach(h=>{ map[h.date] = map[h.date] || []; map[h.date].push(h); });
  return map;
}
function todayISO(){ return localISODate(); }
function isCompletedToday(planDayId){
  const hist = Storage.getWorkoutHistory();
  return hist.some(h=> h.date === todayISO() && h.planDayId === planDayId && h.completed);
}
function hasAnySessionOnDate(date, planDayId){
  const hist = Storage.getWorkoutHistory();
  return hist.some(h=> h.date === date && h.planDayId === planDayId);
}
/** Looks at yesterday only (keeps this simple and non-nagging): if yesterday was a
 *  scheduled workout day and nothing — completed or skipped — was recorded for it,
 *  surface it once so the person can decide what to do, rather than silently
 *  compressing the rest of the week. */
function getMissedWorkout(){
  const yDate = isoForOffset(1);
  const yCode = weekdayCodeForDate((()=>{ const d = new Date(); d.setDate(d.getDate()-1); return d; })());
  if(yCode === 'Sun' || yCode === 'Sat'){ /* still check — rest days aren't excluded by day type */ }
  const day = planDayForWeekday(yCode);
  if(!day) return null; // yesterday was a rest day, nothing to miss
  if(hasAnySessionOnDate(yDate, day.id)) return null;
  if(App.state.missedBannerDismissed[yDate+day.id]) return null;
  return {day, date: yDate, weekday: yCode};
}

            <div class="field"><label class="field-label">Energy (1-5)</label><input class="input" id="rec-energy" type="number" min="1" max="5" placeholder="4"></div>

function submitRecovery(){
  const sleep = document.getElementById('rec-sleep').value;
  const sore = parseInt(document.getElementById('rec-sore').value);
  const energy = parseInt(document.getElementById('rec-energy').value);
  if(!sleep && !sore && !energy){ App.showToast('Enter at least one value'); return; }
  Storage.saveRecoveryEntry({date: todayISO(), sleepHours: parseFloat(sleep)||null, soreness: sore||null, energy: energy||null});
  let msg = 'Check-in logged.';
  if((sore && sore>=4) || (energy && energy<=2)){
    msg = 'Logged. Your soreness/energy suggests today might be a good day to reduce intensity or take an extra recovery day.';
  }
  App.showToast(msg);
  render();
}
function handleMissedSkip(dayId, date){
  Storage.saveWorkoutSession({id:'skip_'+Date.now(), date, planDayId:dayId, dayName: Storage.getWorkoutPlan().days.find(d=>d.id===dayId).name, startTime:null, endTime:null, exercises:[], completed:false, status:'skipped'});
  App.state.missedBannerDismissed[date+dayId] = true;
  App.showToast('Marked as skipped. Moving on with the program.');
  render();
}
function handleMissedMove(dayId, date){
  const plan = Storage.getWorkoutPlan();
  const day = plan.days.find(d=>d.id===dayId);
  const scheduled = new Set(plan.days.map(d=>d.weekday));
  const todayIdx = WEEKDAYS.indexOf(todayWeekdayCode());
  let target = null;
  for(let i=0;i<7;i++){
    const candidate = WEEKDAYS[(todayIdx+i)%7];
    if(!scheduled.has(candidate)){ target = candidate; break; }
  }
  // Also record the missed slot as skipped so it's not re-flagged.
  Storage.saveWorkoutSession({id:'skip_'+Date.now(), date, planDayId:dayId, dayName: day.name, startTime:null, endTime:null, exercises:[], completed:false, status:'skipped'});
  App.state.missedBannerDismissed[date+dayId] = true;
  if(!target){
    App.showToast('No open day this week — skipped and continuing on schedule.');
    render();
    return;
  }
  swapPlanDayWeekday(plan, dayId, target);
  Storage.saveWorkoutPlan(plan);
  const conflicts = checkScheduleConflicts(plan.days);
  App.showToast(conflicts.length ? `Moved ${day.name} to ${WEEKDAY_FULL[target]}. Note: ${conflicts[0]}` : `Moved ${day.name} to ${WEEKDAY_FULL[target]}.`);
  render();
}
function handleMissedReschedule(date, dayId){
  App.state.missedBannerDismissed[date+dayId] = true;
  App.go('profile');
}

/* Debounced per-field autosave for the workout screen — see Storage.saveWorkoutDraft(). */
let draftSaveTimeout, pendingDraftDayId = null;
function scheduleDraftSave(dayId){
  clearTimeout(draftSaveTimeout);
  pendingDraftDayId = dayId;
  draftSaveTimeout = setTimeout(()=> saveDraftNow(dayId), 350);
}
/* BUG FIX (QA re-audit): if the person closed any modal within the 350ms debounce window
 * (e.g. tapped "How to perform" right after typing a weight, then closed it), the pending
 * keystroke had never been written to the draft yet and was lost when the page re-rendered.
 * Closing a modal now flushes the pending save synchronously first. */
function flushDraftSave(){
  if(draftSaveTimeout){
    clearTimeout(draftSaveTimeout);
    if(pendingDraftDayId) saveDraftNow(pendingDraftDayId);
    draftSaveTimeout = null;
    pendingDraftDayId = null;
  }
}
function saveDraftNow(dayId){
  const plan = Storage.getWorkoutPlan();
  const day = plan && plan.days.find(d=>d.id===dayId);
  if(!day) return;
  const fields = {};
  let hasAny = false;
  day.exercises.forEach((pe, idx)=>{
    for(let n=1; n<=pe.sets; n++){
      const w = document.getElementById(`w-${idx}-${n}`);
      const r = document.getElementById(`r-${idx}-${n}`);
      const rpe = document.getElementById(`rpe-${idx}-${n}`);
      const done = document.getElementById(`done-${idx}-${n}`);
      if(w && w.value !== ''){ fields[`w-${idx}-${n}`] = w.value; hasAny = true; }
      if(r && r.value !== ''){ fields[`r-${idx}-${n}`] = r.value; hasAny = true; }
      if(rpe && rpe.value !== ''){ fields[`rpe-${idx}-${n}`] = rpe.value; hasAny = true; }
      if(done && done.checked){ fields[`done-${idx}-${n}`] = true; hasAny = true; }
    }
    const pain = document.getElementById(`pain-${idx}`);
    const notes = document.getElementById(`notes-${idx}`);
    if(pain && pain.checked){ fields[`pain-${idx}`] = true; hasAny = true; }
    if(notes && notes.value){ fields[`notes-${idx}`] = notes.value; hasAny = true; }
  });
  if(!hasAny){ Storage.clearWorkoutDraft(dayId); return; }
  Storage.saveWorkoutDraft(dayId, fields);
}
function openSkipModal(dayId){
  const plan = Storage.getWorkoutPlan();
  const day = plan.days.find(d=>d.id===dayId);
  const otherDays = WEEKDAYS.filter(w=> w !== day.weekday);

    <h3 style="margin:0 0 6px;">Can't train today?</h3>

function skipWorkoutToday(dayId){

function moveWorkoutToDay(dayId){
  const targetWeekday = document.getElementById('skip-move-day').value;

  Storage.clearWorkoutDraft(dayId);

  const conflicts = checkScheduleConflicts(plan.days);

  App.showToast(conflicts.length ? `Moved to ${WEEKDAY_FULL[targetWeekday]}. Note: ${conflicts[0]}` : `Moved ${day.name} to ${WEEKDAY_FULL[targetWeekday]}.`);
  App.go('calendar');

function choosePickerExercise(exId){
  const {dayId, mode, idx} = App.state.picker;
  if(mode === 'add') addExerciseToDay(dayId, exId);
  else swapExerciseInDay(dayId, idx, exId);
}
function addExerciseToDay(dayId, exId){
  const plan = Storage.getWorkoutPlan();
  const day = plan.days.find(d=>d.id===dayId);
  const ex = exById(exId);
  const rx = prescriptionForCurrentProfile(ex);
  day.exercises.push({exerciseId: exId, order: day.exercises.length, sets: rx.sets, reps: rx.reps, rest: rx.rest, rpeTarget: rx.rpe});
  Storage.saveWorkoutPlan(plan);
  Storage.clearWorkoutDraft(dayId); // set-row positions shift, so any unsaved in-progress draft for this day no longer lines up
  App.showToast(`${ex.name} added to ${day.name}.`);
  App.openModal(editDayModalHTML(day));
}
function removeExerciseFromDay(dayId, idx){
  const plan = Storage.getWorkoutPlan();
  const day = plan.days.find(d=>d.id===dayId);
  if(day.exercises.length <= 1){ App.showToast('A workout needs at least one exercise — swap it instead of removing it.'); return; }
  const removed = exById(day.exercises[idx].exerciseId);
  day.exercises.splice(idx, 1);
  day.exercises.forEach((pe,i)=> pe.order = i);
  Storage.saveWorkoutPlan(plan);
  Storage.clearWorkoutDraft(dayId);
  App.showToast(`${removed.name} removed from ${day.name}.`);
  App.openModal(editDayModalHTML(day));
}
function swapExerciseInDay(dayId, idx, newExId){
  const plan = Storage.getWorkoutPlan();
  const day = plan.days.find(d=>d.id===dayId);
  const newEx = exById(newExId);
  const rx = prescriptionForCurrentProfile(newEx);
  const old = day.exercises[idx];
  day.exercises[idx] = {exerciseId: newExId, order: old.order, sets: rx.sets, reps: rx.reps, rest: rx.rest, rpeTarget: rx.rpe};
  Storage.saveWorkoutPlan(plan);
  Storage.clearWorkoutDraft(dayId);
  App.showToast(`Swapped in ${newEx.name}.`);
  App.openModal(editDayModalHTML(day));
}

function completeWorkout(dayId){
  const plan = Storage.getWorkoutPlan();
  const day = plan.days.find(d=>d.id===dayId);
  const exercises = day.exercises.map((pe, idx)=>{
    const topRep = parseInt((pe.reps.split('–')[1]||pe.reps.split('-')[1]||pe.reps).replace(/\D/g,'')) || 10;
    const sets = [];
    for(let n=1;n<=pe.sets;n++){
      const w = document.getElementById(`w-${idx}-${n}`);
      const r = document.getElementById(`r-${idx}-${n}`);
      const rpe = document.getElementById(`rpe-${idx}-${n}`);
      if(w && (w.value || r.value)){
        sets.push({weight: parseFloat(w.value)||0, reps: parseFloat(r.value)||0, rpe: parseFloat(rpe.value)||null, pain: document.getElementById(`pain-${idx}`).checked});
      }
    }
    return {exerciseId: pe.exerciseId, name: exById(pe.exerciseId).name, sets, targetTopRep: topRep, notes: (document.getElementById(`notes-${idx}`)||{}).value || ''};
  }).filter(e=> e.sets.length>0);

  if(exercises.length === 0){
    App.showToast('Log at least one set before completing the workout.');
    return;
  }
  const session = {
    id: 'wo_'+Date.now(), date: todayISO(), planDayId: dayId, dayName: day.name,
    startTime: App.state.workoutStartTime || new Date().toISOString(), endTime: new Date().toISOString(),
    exercises, completed: true,
  };
  Storage.saveWorkoutSession(session);
  Storage.clearWorkoutDraft(dayId);
  App.state.workoutStartTime = null;
  App.state.workoutStartTimeDayId = null;
  App.showToast(`Workout complete — ${exercises.length} exercises logged.`);
  App.go('dashboard');
}

/* =========================================================================
   CALENDAR
========================================================================= */
function mondayOfThisWeek(){ const d = new Date(); const day = d.getDay(); const diff = (day===0?-6:1-day); d.setDate(d.getDate()+diff); d.setHours(0,0,0,0); return d; }
function datesForCurrentWeek(){
  const mon = mondayOfThisWeek();
  const map = {};
  WEEKDAYS.forEach((code,i)=>{ const d = new Date(mon); d.setDate(mon.getDate()+i); map[code] = localISODate(d); });
  return map;
}
function renderCalendar(p){
  const plan = Storage.getWorkoutPlan();
  if(!plan) return `<div class="empty-state">No plan yet.</div>`;
  const todayCode = todayWeekdayCode();
  const todayStr = todayISO();
  const weekDates = datesForCurrentWeek();
  const hist = Storage.getWorkoutHistory();
  const conflicts = checkScheduleConflicts(plan.days);

  const cards = WEEKDAYS.map(code=>{
    const day = plan.days.find(d=>d.weekday===code);
    const isToday = code === todayCode;
    const isRest = !day;
    const cellDate = weekDates[code];
    const isPast = cellDate < todayStr;
    let session = null;
    if(day) session = hist.find(h=> h.planDayId===day.id && h.date===cellDate) || null;
    const isCompleted = session && session.completed;
    const isSkipped = session && !session.completed && (session.status==='skipped'||session.status==='moved');
    const isMissed = day && !session && isPast;
    let badge = 'Upcoming', badgeStyle = '';
    if(isRest){ badge='Rest'; }
    if(isToday){ badge='Today'; badgeStyle='border-color:var(--ember);color:var(--ember);'; }
    if(isCompleted){ badge='Completed'; badgeStyle='border-color:var(--good);color:var(--good);'; }
    else if(isSkipped){ badge = session.status==='moved' ? 'Rescheduled' : 'Skipped'; badgeStyle='border-color:var(--amber);color:var(--amber);'; }
    else if(isMissed){ badge='Missed'; badgeStyle='border-color:var(--danger);color:var(--danger);'; }

    return `
      <div class="card" draggable="${!isRest}" data-weekday="${code}"
        ondragstart="event.dataTransfer.setData('text/plain','${code}')"
        ondragover="event.preventDefault()"
        ondrop="onCalendarDrop(event,'${code}')"
        style="cursor:pointer;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="cursor:pointer;flex:1;" onclick="${isRest ? `openRestDayModal('${cellDate}')` : `App.state.activeWorkoutDay='${day.id}';App.go('workout')`}">
            <div style="font-size:12px;color:var(--text-dim);font-weight:700;">${WEEKDAY_FULL[code]}${isToday?' · Today':''}</div>
            <div style="font-weight:700;font-size:16px;margin-top:2px;">${isRest?'Rest day':day.name}</div>
            ${!isRest?`<div style="font-size:12px;color:var(--text-faint);margin-top:2px;">${day.exercises.length} exercises</div>`:`<div style="font-size:12px;color:var(--text-faint);margin-top:2px;">Recovery & mobility</div>`}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <span class="pill" style="${badgeStyle}">${badge}</span>
            ${!isRest?`<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openChangeDayModal('${day.id}')">Change day</button>`:''}
          </div>
        </div>
      </div>`;
  }).join('');

  const conflictBanner = conflicts.length ? `
    <div class="card" style="margin-bottom:16px;border-color:var(--amber);">
      <div style="font-weight:700;font-size:13.5px;margin-bottom:6px;">Recovery note</div>
      ${conflicts.map(c=>`<div style="font-size:12.5px;color:var(--text-dim);margin-bottom:4px;">${c} Consider spacing these out for better recovery — this is a suggestion, not a rule.</div>`).join('')}
    </div>` : '';

  return `<div class="fade-in">
    <p style="color:var(--text-dim);font-size:13.5px;margin-bottom:14px;">Split style: <strong style="color:var(--text)">${plan.style}</strong> · ${plan.daysPerWeek} days/week · drag a workout card onto another day to swap them, or use "Change day".</p>
    ${conflictBanner}
    <div class="grid" style="gap:12px;">${cards}</div>
  </div>`;
}
function onCalendarDrop(event, targetWeekday){
  event.preventDefault();
  const sourceWeekday = event.dataTransfer.getData('text/plain');
  if(!sourceWeekday || sourceWeekday === targetWeekday) return;
  const plan = Storage.getWorkoutPlan();
  const sourceDay = plan.days.find(d=>d.weekday===sourceWeekday);
  if(!sourceDay) return;
  swapPlanDayWeekday(plan, sourceDay.id, targetWeekday);
  Storage.saveWorkoutPlan(plan);
  const conflicts = checkScheduleConflicts(plan.days);
  App.showToast(conflicts.length ? `Schedule updated. ${conflicts[0]}` : 'Schedule updated.');
  render();
}
function openChangeDayModal(dayId){
  const plan = Storage.getWorkoutPlan();
  const day = plan.days.find(d=>d.id===dayId);
  App.openModal(`
    <h3 style="margin:0 0 10px;">Change day for ${day.name}</h3>
    <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 14px;">Currently on ${WEEKDAY_FULL[day.weekday]}. Choose a new day — if another workout is already there, the two will swap.</p>
    <select id="change-day-select" class="input" style="margin-bottom:16px;">${WEEKDAYS.map(w=>`<option value="${w}" ${w===day.weekday?'selected':''}>${WEEKDAY_FULL[w]}</option>`).join('')}</select>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="applyChangeDay('${dayId}')">Save</button>
      <button class="btn btn-ghost" onclick="App.closeModal()">Cancel</button>
    </div>
  `);
}
function applyChangeDay(dayId){
  const newWeekday = document.getElementById('change-day-select').value;
  const plan = Storage.getWorkoutPlan();
  swapPlanDayWeekday(plan, dayId, newWeekday);
  Storage.saveWorkoutPlan(plan);
  const conflicts = checkScheduleConflicts(plan.days);
  App.closeModal();
  App.showToast(conflicts.length ? `Moved. ${conflicts[0]}` : 'Day changed.');
}
function openRestDayModal(dateStr){
  App.openModal(`
    <h3 style="margin:0 0 8px;">Rest day</h3>
    <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 14px;">Recommended: light walking, easy mobility, optional stretching, adequate hydration, nutrition, and sleep.</p>
    <div class="grid grid-2">

let chartInstances = {};
function initProgressCharts(){
  Object.values(chartInstances).forEach(c=>{ try{c.destroy();}catch(e){} });
  chartInstances = {};
  const css = getComputedStyle(document.documentElement);
  const gridColor = css.getPropertyValue('--border').trim();
  const textColor = css.getPropertyValue('--text-dim').trim();
  const emberColor = css.getPropertyValue('--ember').trim();
  const tealColor = css.getPropertyValue('--teal').trim();
  Chart.defaults.color = textColor;
  Chart.defaults.borderColor = gridColor;
  Chart.defaults.font.family = "Inter";

  const measurements = Storage.getBodyMeasurements();
  const wCanvas = document.getElementById('chart-weight');
  if(wCanvas){
    chartInstances.weight = new Chart(wCanvas, {type:'line', data:{labels: measurements.map(m=>m.date), datasets:[{data: measurements.map(m=>m.weight), borderColor: emberColor, backgroundColor:'transparent', tension:.3}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:false}}}});
  }
  const bfCanvas = document.getElementById('chart-bf');
  if(bfCanvas){
    const bfData = measurements.filter(m=>m.bodyFat!=='' && m.bodyFat!=null);
    chartInstances.bf = new Chart(bfCanvas, {type:'line', data:{labels: bfData.map(m=>m.date), datasets:[{data: bfData.map(m=>m.bodyFat), borderColor: tealColor, backgroundColor:'transparent', tension:.3}]}, options:{plugins:{legend:{display:false}}}});
  }
  ['benchPress','squat','rdl','latPulldown','ohp','legPress'].forEach(id=>{
    const c = document.getElementById('chart-'+id);
    if(!c) return;
    const hist = Storage.getExerciseHistory(id);
    chartInstances[id] = new Chart(c, {type:'line', data:{labels: hist.map(h=>h.date), datasets:[{data: hist.map(h=>Math.max(...h.sets.map(s=>s.weight))), borderColor: emberColor, backgroundColor:'transparent', tension:.3}]}, options:{plugins:{legend:{display:false}}}});
  });
  const consistencyCanvas = document.getElementById('chart-consistency');
  if(consistencyCanvas){
    const hist = Storage.getWorkoutHistory().filter(h=>h.completed);
    const byWeek = {};
    hist.forEach(h=>{
      const d = parseLocalDate(h.date);
      const week = getWeekKey(d);
      byWeek[week] = (byWeek[week]||0)+1;
    });
    const weeks = Object.keys(byWeek).sort();
    chartInstances.consistency = new Chart(consistencyCanvas, {type:'bar', data:{labels: weeks, datasets:[{data: weeks.map(w=>byWeek[w]), backgroundColor: emberColor, borderRadius:6}]}, options:{plugins:{legend:{display:false}}}});
  }
}
function getWeekKey(d){
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return d.getFullYear()+'-W'+week;
}

async function submitAuthForm(){
  const email = (document.getElementById('auth-email').value || '').trim();
  const password = document.getElementById('auth-password').value || '';
  if(!email || !password){ App.state.authError = 'Enter an email and password.'; render(); return; }
  if(password.length < 6){ App.state.authError = 'Password must be at least 6 characters.'; render(); return; }
  App.state.authBusy = true; App.state.authError = ''; render();
  try{
    if(App.state.authMode === 'signup'){
      await Supa.signUp(email, password);
      if(!Supa.isSignedIn()){
        // Project has "confirm email" enabled — there's no session yet until they click the email link.
        App.state.authBusy = false;
        App.state.authMode = 'signin';
        App.state.authError = 'Account created — check your email to confirm it, then sign in here.';
        render();
        return;
      }
    } else {
      await Supa.signIn(email, password);
    }
    App.state.authBusy = false;
    await onSignedIn();
  }catch(e){
    App.state.authBusy = false;
    App.state.authError = (e && e.message) ? e.message : 'Something went wrong — please try again.';
    render();
  }

/** Applies a pulled Supabase bundle onto local storage. Shared by the silent boot-time
 * hydration (no toast — should feel invisible) and the interactive post-sign-in path
 * (which does toast, from onSignedIn() below). */
function applyRemoteBundle(remote){
  if(!remote || !Object.keys(remote).length) return false;
  if(remote.profile) writeJSON(LS.PROFILE, remote.profile);
  if(remote.plan) writeJSON(LS.PLAN, remote.plan);
  if(remote.data){
    if(remote.data.history) writeJSON(LS.HISTORY, remote.data.history);
    if(remote.data.measurements) writeJSON(LS.MEASURE, remote.data.measurements);
    if(remote.data.recovery) writeJSON(LS.RECOVERY, remote.data.recovery);
  }
  if(remote.draft) writeJSON(LS.DRAFT, remote.draft);
  if(remote.settings){ writeJSON(LS.SETTINGS, remote.settings); document.documentElement.setAttribute('data-theme', remote.settings.theme || 'dark'); }
  if(remote.customExercises){ writeJSON(LS.CUSTOM_EX, remote.customExercises); loadCustomExercisesIntoLibrary(); }
  return true;
}
/** Runs right after a successful sign-in: pulls whatever's already saved for this account
 * and hydrates local storage from it, then subscribes to live changes from other devices. */
async function onSignedIn(){
  const remote = await Supa.pull();
  if(applyRemoteBundle(remote)){
    App.showToast('Signed in — loaded your saved data from this account.');
  } else {
    App.showToast('Signed in. Use "Migrate this device\'s data" below to upload what\'s on this device.');
  }
  Supa.subscribe(onSupaRemoteChange);
  render();
}
function onSupaRemoteChange(key, value){
  applyRemoteBundle({[key]: value});
  render();
}
async function runMigration(){
  App.state.migrateBusy = true; render();
  try{
    await Supa.migrateLocalToAccount();
    App.showToast('This device\'s data has been uploaded to your account.');
  }catch(e){
    App.showToast('Migration failed — nothing on this device was changed. ' + ((e&&e.message)||''));
  }
  App.state.migrateBusy = false; render();
}

function saveProfileAndRegenerate(){
  Storage.saveUserProfile(App.state.profileDraft);
  const plan = generatePlan(App.state.profileDraft);
  Storage.saveWorkoutPlan(plan);
  // If a 2-day schedule made a true Push/Pull/Legs split impossible (no room for a leg day),
  // generatePlan silently falls back to a balanced Full Body pair — say so, rather than

  const requestedStyle = App.state.profileDraft.style;
  if(requestedStyle && requestedStyle !== 'Custom' && plan.style !== requestedStyle){
    App.showToast(`Saved. With only ${plan.daysPerWeek} day(s)/week, "${requestedStyle}" can't include every muscle group, so we used a balanced "${plan.style}" split instead.`);

  }

function exportData(){
  const data = Storage.exportAll();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `gym-workout-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  App.showToast('Backup exported');
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const obj = JSON.parse(reader.result);
      if(!obj.dataVersion) throw new Error('Not a valid backup file');
      // BUG FIX (QA audit): this used to inline the whole backup as JSON text inside an
      // HTML onclick="" attribute. Any real backup contains quotes, which broke out of the
      // attribute and corrupted the modal markup — import essentially never worked on a
      // genuine backup file. Stashing the parsed object on App.state instead avoids ever
      // serializing untrusted data into HTML.
      App.state.pendingImport = obj;
      App.openModal(`
        <h3 style="margin:0 0 10px;">Import backup?</h3>
        <p style="color:var(--text-dim);font-size:14px;">This will overwrite your current profile, workout history, and measurements with the contents of this backup file.</p>
        <div style="display:flex;gap:10px;margin-top:18px;">
          <button class="btn btn-primary" onclick="confirmImport()">Import</button>
          <button class="btn btn-ghost" onclick="App.state.pendingImport=null;App.closeModal()">Cancel</button>
        </div>
      `);
    }catch(e){
      App.showToast('Invalid backup file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}
function confirmImport(){
  const obj = App.state.pendingImport;
  App.state.pendingImport = null;
  if(!obj){ App.showToast('Nothing to import.'); return; }
  Storage.importAll(obj);
  App.closeModal();
  App.showToast('Import successful. Your workout history has been restored.');
  App.state.profileDraft = null;
  App.go('dashboard');
}
